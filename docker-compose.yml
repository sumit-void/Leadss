version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadgen_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-leadgen}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadgen}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis Queue ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker: Search ────────────────────────────
  worker-search:
    build: .
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q search -l info -c 2 --max-tasks-per-child=50
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker: Crawl + Email ─────────────────────
  worker-crawl:
    build: .
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q crawl,email -l info -c 3 --max-tasks-per-child=100
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker: Audit ─────────────────────────────
  worker-audit:
    build: .
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q audit -l info -c 2 --max-tasks-per-child=100
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
